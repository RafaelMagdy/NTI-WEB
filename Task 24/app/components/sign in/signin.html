<div class="form-container">
    <h2>Sign In</h2>
    
    <form #signInForm="ngForm" (ngSubmit)="onSubmit(signInForm)">
      
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="user.email" 
          required 
          email
          #email="ngModel">
        <div *ngIf="email.invalid && (email.dirty || email.touched)" class="error-message">
          <div *ngIf="email.errors?.['required']">Email is required.</div>
          <div *ngIf="email.errors?.['email']">Enter a valid email address.</div>
        </div>
      </div>
  
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="user.password" 
          required 
          minlength="6"
          #password="ngModel">
        <div *ngIf="password.invalid && (password.dirty || password.touched)" class="error-message">
          <div *ngIf="password.errors?.['required']">Password is required.</div>
          <div *ngIf="password.errors?.['minlength']">Password must be at least 6 characters.</div>
        </div>
      </div>
  
      <div *ngIf="successMessage" class="success-alert">{{ successMessage }}</div>
      <div *ngIf="errorMessage" class="error-alert">{{ errorMessage }}</div>
  
      <button type="submit" [disabled]="!signInForm.valid">Sign In</button>
    </form>
  </div>
